AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ICAA Mailing List API

Parameters:
  architecture:
    Description: Architecture to run on
    Type: String
    Default: x86_64
    AllowedValues:
      - arm64
      - x86_64

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        OTEL_EXPORTER_OTLP_ENDPOINT: ""

Resources:
  MailingListHttpApi:
    Type: AWS::Serverless::HttpApi

  MailingListApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      DomainName: api.icaa.world
      ApiId: !Ref MailingListHttpApi
      Stage: !Ref MailingListHttpApi.Stage
      ApiMappingKey: mailing-list

  ICAAMailingList:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - !Ref architecture
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameters
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mailerlite-api-key"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cfTurnstileSecretKey"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/newrelic-license-key"
      Events:
        APIEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref MailingListHttpApi
            Path: '/{proxy+}'
            Method: ANY
    Metadata:
      DockerTag: v1
      DockerContext: .
      Dockerfile: Dockerfile

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ICAAMailingList}
      RetentionInDays: 30
